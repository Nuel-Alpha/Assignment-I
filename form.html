<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title> (add title) </title>
  </head>
  <body>
    <header>
      <!-- Global navigation section-->
      <nav aria-label="Global navigation">
        <a href="index.html">Home</a>
        <a href="form.html">Apply Here</a>
      </nav>
      <hr />
     
      <h1>AltSchool</h1>
      
    </header>
   
    <main>
      <!--signup/signin buttons-->
      <form>
        <fieldset>
          <button type="submit" value="signup">
            Sign up
          </button>
          <button type="submit" value="signin">Sign in</button>
        </fieldset>
      </form>
      <!--signup section-->
      <h2>Sign up</h2>
      <p>Create an account to get started on your learning journey</p>
      <!---warning/important information-->
      
        <p>
          Important: Your name will appear on your certificate exactly as entered
        </p>

      <br />
      <!--form section-->
      <form action="#" method="post">
        <fieldset>
         
          <p>
            <label for="">Email</label>Email<br />
            <input
              type="email"
              id="email"
              name="email"
              placeholder="johndoe@example.com"
              required
            />
          </p>

         
          <p>
            <label for="first-name">First name</label><br />
            <input
              type="text"
              id="first-name"
              name="first-name"
              placeholder="John"
              required
            />
          </p>
         
          <p>
            <label for="last-name">Last name</label><br />
            <input
              type="text"
              id="last-name"
              name="last-name"
              placeholder="Doe"
              required
            />
          </p>
         
          <p>
            <label for="phone">Phone number</label><br />
            <input
              type="tel"
              id="phone"
              name="phone"
              placeholder="+1234567890"
              required
            />
          </p>
         
          <p>
            <label for="password">Password</label><br />
            <input
              type="password"
              id="password"
              name="password"
              placeholder="********"
              required
            />
          </p>
          <!-- Terms and Privacy -->
          <p>
         
            <label for="terms"
              >By clicking Create account, I agree to the
              <a href="#" target="_blank">Terms of Use</a> and acknowledge that
              I have read the<a href="#" target="_blank"> Privacy Policy</a>.
            </label>
          </p>
          <!-- Submit -->
          <p>
            <button type="submit">Create account</button>
          </p>
        </fieldset>
      </form>
      <section>
        <h2 id="alternative-signup">Or</h2>
        <p>
          <button type="button">Login with Google</button>
        </p>
      </section>
    </main>
    <hr />
    <!-- Footer -->
    <footer>
      <h2>Contact Information</h2>

      <address>
        Put your state and country <br />
        Your email :<a href="mailto:emmanuelenimabasi@gmail.com">
          Email@…..com</a
        >
      </address>

      <p>&copy; 2026 Akpan Emmanuel </p>
    </footer>
  </body>
</html>
